version: 2026.240.1943
hyprland:
    candy:
        version: 2026.242.0620
        description: |
            The nested-compositor primitive: Hyprland running inside a parent Wayland
            display, with its Lua config, its session launcher, and the file-capability
            strip that lets it exec under a pod's no-new-privileges.

            Hyprland is ALWAYS nested here — it has no headless-only mode. The binary
            exposes no --headless flag and no HYPRLAND_HEADLESS_ONLY (verified against
            the shipped binary's strings and --help), and Aquamarine's DRM backend needs
            a KMS card node a rootless pod never gets; a standalone attempt aborts with
            `CBackend::create() failed!`. So every bed composing this candy must supply a
            parent display, and that parent must clear two bars: it must advertise
            `zwp_linux_dmabuf_v1` (Aquamarine's Wayland backend hard-requires it, so a
            software-rendered parent will not do) and bind `xdg_wm_base` at version 6.
            The whole wlroots family is one version short today; gst-wayland-display
            (Smithay) clears both, which is why this nesting works at all.

            Two details that are silent failures if missed. `setcap -r` on the binary: a
            file-capability binary cannot exec under no-new-privileges. And
            LIBSEAT_BACKEND=noop, not `none` — `none` is not a libseat backend name and
            only appears to work by inducing EINVAL.
        require:
            # plugin-wl serves the `wl:` check verb OUT OF PROCESS. Without this
            # require the wl: steps below do not fail -- they SKIP with "unknown
            # verb", which reads as not-failed in a summary. A pinned require is
            # what makes them actually run.
            - '@github.com/opencharly/plugin-wl/candy/plugin-wl:v2026.242.0610'
        package:
            - hyprland
            - hyprlock
            - xorg-xwayland
            - libcap
            - grim
        service:
            - name: cstream-hyprland
              exec: /usr/local/bin/hyprland-session
              env:
                XDG_RUNTIME_DIR: /tmp/cstream-rt
                # The parent (gst-wayland-display) creates wayland-1. The child must be
                # TOLD which socket to attach to -- the launcher refuses to guess, since
                # attaching to the wrong display looks like success and streams nothing.
                WAYLAND_DISPLAY: wayland-1
                LIBSEAT_BACKEND: noop
                HYPRLAND_CONFIG: /etc/cstream/hyprland.lua
                XDG_CURRENT_DESKTOP: Hyprland
                XDG_SESSION_TYPE: wayland
              restart: always
              priority: 12
              start_sec: 2
              enable: true
              scope: system
              # Hyprland ABORTS outright if the parent socket is not yet listening, so
              # the ordering is a supervised wait on the socket rather than a sleep. As
              # a wait_for a timeout fails the SERVICE, instead of surfacing as a
              # Hyprland crash with a misleading cause.
              wait_for:
                paths:
                    - "${XDG_RUNTIME_DIR}/wayland-1"
                timeout: 30s
        plan:
            - run: stage the Lua config — Hyprland 0.55+ is Lua-only, hyprlang is gone
              copy: etc/hyprland.lua
              to: /etc/cstream/hyprland.lua
              mode: "0644"
              run_as: root
            - run: stage the session launcher
              copy: etc/hyprland-session
              to: /usr/local/bin/hyprland-session
              mode: "0755"
              run_as: root
            - run: strip file capabilities from the Hyprland binary
              command: |
                set -eu
                # A file-capability binary cannot exec under a pod's no-new-privileges.
                # setcap -r fails on a binary that has none, which is the common case on
                # a fresh install -- so tolerate that and assert the END STATE below.
                setcap -r /usr/bin/Hyprland 2>/dev/null || true
              run_as: root
            - check: the Hyprland binary is installed
              id: hypr-binary
              file:
                file: /usr/bin/Hyprland
                exists: true
            - check: the Hyprland binary carries NO file capabilities — it must exec under no-new-privileges
              id: hypr-no-file-caps
              exit_status: 0
              command: |
                out=$(getcap /usr/bin/Hyprland 2>/dev/null || true)
                if [ -n "$out" ]; then echo "UNEXPECTED CAPS: $out"; exit 1; fi
                echo NO-CAPS
              stdout:
                - contains: NO-CAPS
            - check: "Hyprland runs, but only with XDG_RUNTIME_DIR set — even --version aborts without it"
              id: hypr-needs-runtime-dir
              exit_status: 0
              command: |
                set -eu
                # Measured: `Hyprland --version` with XDG_RUNTIME_DIR unset dies with
                #   terminate called after throwing an instance of 'std::runtime_error'
                #   what():  XDG_RUNTIME_DIR is not set!
                # and exit 134 (SIGABRT). So it is NOT usable as a bare liveness probe,
                # and any consumer invoking the binary must export XDG_RUNTIME_DIR first.
                # Both halves are asserted here so the constraint cannot regress silently.
                # `XDG_RUNTIME_DIR=` sets it EMPTY, which Hyprland accepts -- it tests
                # for presence, not for a non-empty value. `env -u` is what actually
                # removes it, and is what a consumer's environment looks like.
                if env -u XDG_RUNTIME_DIR Hyprland --version >/dev/null 2>&1; then
                    echo "UNEXPECTED: --version succeeded with XDG_RUNTIME_DIR unset"; exit 1
                fi
                d=$(mktemp -d)
                XDG_RUNTIME_DIR="$d" Hyprland --version | head -1
                rm -rf "$d"
              stdout:
                - contains: Hyprland
            - check: the session launcher execs Hyprland rather than backgrounding it
              id: hypr-launcher-exec
              exit_status: 0
              command: grep -c '^exec Hyprland$' /usr/local/bin/hyprland-session
              stdout:
                - contains: "1"
            - check: the launcher waits for the parent socket instead of sleeping — Hyprland aborts if it is absent
              id: hypr-launcher-waits
              exit_status: 0
              command: |
                grep -q 'while \[ ! -S "$sock" \]' /usr/local/bin/hyprland-session || exit 1
                echo WAITS
              stdout:
                - contains: WAITS
            - check: the Lua config targets WAYLAND-1, the nested output name
              id: hypr-config-output
              exit_status: 0
              command: grep -c 'output = "WAYLAND-1"' /etc/cstream/hyprland.lua
              stdout:
                - contains: "1"
            - check: "the Lua config grants grim screencopy — enforce_permissions denies it per binary otherwise"
              id: hypr-config-screencopy
              exit_status: 0
              command: |
                grep -q 'enforce_permissions = true' /etc/cstream/hyprland.lua || exit 1
                grep -q 'hl.permission(.*grim.*screencopy.*allow' /etc/cstream/hyprland.lua || exit 1
                echo SCREENCOPY-GRANTED
              stdout:
                - contains: SCREENCOPY-GRANTED
            - check: "vfr sits under debug: — it moved out of misc: in Hyprland 0.55"
              id: hypr-config-vfr-location
              exit_status: 0
              command: |
                # vfr must sit under debug:, and there must be no misc = { } BLOCK.
                # Matching the bare word "misc" would false-positive on the comment
                # that explains the move, so match the assignment itself.
                grep -q 'debug .*= { vfr = true' /etc/cstream/hyprland.lua || exit 1
                if grep -qE '^\s*misc\s*=' /etc/cstream/hyprland.lua; then exit 1; fi
                echo VFR-UNDER-DEBUG
              stdout:
                - contains: VFR-UNDER-DEBUG
