# The minimum hyprlock needs to exist at all.
#
# hyprlock REFUSES TO START without a config -- it does not fall back to
# defaults. Measured on hyprlock v0.9.6 in this pod:
#
#   Hyprlock version v0.9.6
#   CRIT: Config path error: Could not find config.
#         Searched in order: XDG_CONFIG_HOME, HOME, XDG_CONFIG_DIRS, /etc/xdg
#
# and the process exits immediately. So shipping the `hyprlock` package without
# a config ships a lock screen that cannot lock, which is what this file fixes.
#
# It lives in /etc/xdg (the last entry of hyprlock's own search order) rather
# than a user's ~/.config so that EVERY session gets it, including the ones the
# broker creates for accounts that have no dotfiles yet. A user who wants their
# own appearance still wins: XDG_CONFIG_HOME and HOME are searched first.
#
# Deliberately minimal. This is the floor that makes locking work, not a theme:
# the fields below are the two hyprlock requires to render at all. Anything
# else -- fonts, images, layout -- is a per-deployment choice and belongs in a
# user config, where it will override this one.

background {
    color = rgba(20, 20, 30, 1.0)
}

input-field {
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.3
    placeholder_text = <i>Password…</i>
}
